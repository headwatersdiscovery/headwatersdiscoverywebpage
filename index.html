<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headwaters Discovery .org</title>
  <meta name="description" content="A not-for-profit research team pioneering upstream science to unlock new therapies for unmet global health challenges.">
  <meta property="og:title" content="Headwaters Discovery .org">
  <meta property="og:description" content="A not-for-profit research team pioneering upstream science to unlock new therapies for unmet global health challenges.">
  <meta property="og:image" content="https://headwatersdiscovery.org/assets/headwaters-poster.jpg">
  <meta property="og:url" content="https://headwatersdiscovery.org/">
  <meta name="theme-color" content="#07090d">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090d;
      --ink: #f2efe8;
      --ink-muted: rgba(242, 239, 232, 0.72);
      --ink-faint: rgba(242, 239, 232, 0.5);
      --rule: rgba(242, 239, 232, 0.22);
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --gutter: clamp(1.25rem, 5vw, 4rem);
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 1rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Background video: fills the viewport, anchored toward the moon so it stays in frame on narrow screens. */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: var(--bg) url("assets/headwaters-poster.jpg") 72% center / cover no-repeat;
    }
    .bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 72% center;
    }
    /* Darken the left side so text stays legible over the brighter sky. */
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(7, 9, 13, 0.7) 0%, rgba(7, 9, 13, 0.25) 55%, rgba(7, 9, 13, 0) 80%),
        linear-gradient(0deg, rgba(7, 9, 13, 0.6) 0%, rgba(7, 9, 13, 0) 30%);
    }

    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 0 var(--gutter);
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1.75rem 0;
    }

    .wordmark {
      font-family: var(--serif);
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--ink);
      text-decoration: none;
    }
    .wordmark span { color: var(--ink-faint); font-weight: 300; }

    a.link {
      color: var(--ink);
      font-size: 0.9375rem;
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }
    a.link:hover, a.link:focus-visible { border-color: var(--ink); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 40rem;
      padding: 3rem 0;
    }

    .eyebrow {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(2.5rem, 7vw, 4.75rem);
      line-height: 1.05;
      letter-spacing: -0.015em;
      margin-bottom: 1.75rem;
    }
    h1 em { font-style: italic; }

    .lede {
      font-size: clamp(1.0625rem, 1.6vw, 1.25rem);
      color: var(--ink-muted);
      max-width: 34rem;
      margin-bottom: 2.5rem;
    }

    .cta {
      align-self: flex-start;
      display: inline-block;
      color: var(--bg);
      background: var(--ink);
      font-size: 0.9375rem;
      font-weight: 500;
      text-decoration: none;
      padding: 0.85rem 1.6rem;
      border-radius: 999px;
      transition: opacity 0.2s;
    }
    .cta:hover, .cta:focus-visible { opacity: 0.85; }

    footer {
      font-size: 0.8125rem;
      color: var(--ink-faint);
      border-top: 1px solid var(--rule);
      flex-wrap: wrap;
    }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--ink); }

    @media (prefers-reduced-motion: reduce) {
      .bg video { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto" poster="assets/headwaters-poster.jpg">
      <source src="assets/headwaters-bg.mp4" type="video/mp4">
    </video>
  </div>

  <div class="page">
    <header>
      <a class="wordmark" href="/">Headwaters Discovery <span>.org</span></a>
      <a class="link" href="mailto:contact@headwatersdiscovery.org">Contact</a>
    </header>

    <main>
      <p class="eyebrow">Launching in 2027</p>
      <h1>Pioneering <em>upstream</em> science</h1>
      <p class="lede">We&rsquo;re a not-for-profit research team pioneering upstream science to unlock new therapies for unmet global health challenges.</p>
      <a class="cta" href="mailto:contact@headwatersdiscovery.org">Get in touch</a>
    </main>

    <footer>
      <span>&copy; 2026 Headwaters Discovery</span>
      <a href="mailto:contact@headwatersdiscovery.org">contact@headwatersdiscovery.org</a>
    </footer>
  </div>
</body>
</html>
